<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Cart - ShopEase</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="navbar">
        <h1 class="logo">ShopEase</h1>

        <a href="index.html">Continue Shopping</a>
      </div>
    </header>

    <section class="products-section">
      <div class="section-heading">
        <h2>My Shopping Cart</h2>
        <p>Your selected products</p>
      </div>

      <div class="products-grid" id="cartContainer">
        <p>Loading Cart...</p>
      </div>

      <div id="cartSummary">
        <h2>Total: <span id="cartTotal">₹0</span></h2>

        <button id="placeOrderBtn" class="add-to-cart">Place Order</button>
        <button id="clearCartBtn" class="remove-from-cart">Clear Cart</button>
      </div>
    </section>

    <script src="js/cart.js"></script>
  </body>
</html>
