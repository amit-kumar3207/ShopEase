<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Successful - ShopEase</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="navbar">
        <h1 class="logo">ShopEase</h1>

        <a href="index.html">Home</a>
      </div>
    </header>

    <section class="products-section">
      <div class="section-heading">
        <h2>Order Confirmed!</h2>
        <p>Your demo order was submitted successfully.</p>
      </div>

      <div class="order-details">
        <h3>Customer Information</h3>

        <p>Name: <span id="customerName"></span></p>

        <h3>Order Summary</h3>

        <p>Total Products: <span id="successTotalItems"></span></p>

        <p>Total Amount: ₹<span id="successTotalPrice"></span></p>

        <p>Order Date: <span id="orderDate"></span></p>
      </div>
    </section>

    <script src="js/order-success.js"></script>
  </body>
</html>
